name: 建構並部署書籍

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GitHub Pages 部署所需權限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只允許一個部署，但不取消進行中的 build
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安裝 mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: 安裝 mdbook-mermaid（Mermaid 圖表支援）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MERMAID_VERSION=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/badboy/mdbook-mermaid/releases/latest \
            | grep '"tag_name"' | cut -d'"' -f4)
          echo "Installing mdbook-mermaid ${MERMAID_VERSION}"
          curl -sSL "https://github.com/badboy/mdbook-mermaid/releases/download/${MERMAID_VERSION}/mdbook-mermaid-${MERMAID_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz
          sudo mv mdbook-mermaid /usr/local/bin/

      - name: 產生 mermaid.min.js 與 mermaid-init.js（套用自訂 dagre layout）
        # mdbook-mermaid install 會把瀏覽器端的 mermaid.js 與
        # 預設初始化腳本寫到 book root。隨後我們用 assets/mermaid-init.js
        # 覆蓋預設 init，套用 dagre layout 與其他自訂設定。
        run: |
          mdbook-mermaid install .
          cp assets/mermaid-init.js mermaid-init.js

      - name: 建構書籍
        run: mdbook build

      - name: 上傳建構成品（僅 main 分支）
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/html

  deploy:
    name: 部署到 GitHub Pages
    # 只在 push 到 main 時部署（PR 只跑 build 驗證）
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
